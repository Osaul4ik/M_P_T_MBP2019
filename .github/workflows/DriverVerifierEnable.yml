name: DriverVerifierEnable

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to confirm — this WILL apply Verifier flags and schedule a reboot'
        required: true
      watchdog_grace_minutes:
        description: 'Minutes to wait for post-reboot confirmation before watchdog auto-resets Verifier'
        required: false
        default: '10'

env:
  DRIVER_FILE: AmtPtpDeviceUsbKm.sys

  # 0x000BAFBF =
  # selected Standard + Additional Driver Verifier checks:
  #
  # ENABLED:
  #   0x00000001  Special Pool
  #   0x00000002  Force IRQL Checking
  #   0x00000004  Randomized Low Resources Simulation
  #   0x00000008  Pool Tracking
  #   0x00000010  I/O Verification
  #   0x00000020  Deadlock Detection
  #   0x00000080  DMA Checking
  #   0x00000100  Security Checks
  #   0x00000200  Force Pending I/O Requests
  #   0x00000400  IRP Logging
  #   0x00000800  Miscellaneous Checks
  #   0x00002000  Invariant MDL Checking for Stack
  #   0x00008000  Power Framework Delay Fuzzing
  #   0x00010000  Port/Miniport Interface Checking
  #   0x00020000  DDI Compliance Checking (standard)
  #   0x00080000  DDI Compliance Checking (additional)
  #
  # DISABLED:
  #   0x00040000  Systematic Low Resource Simulation
  #   0x00100000  RESERVED / unsupported
  #   0x00200000  NDIS/WIFI Verification
  #   0x00800000  Kernel Synchronization Delay Fuzzing
  #   0x01000000  VM Switch Verification
  #   0x02000000  Code Integrity Checks
  #
  # Driver Verifier target list contains ONLY:
  #   AmtPtpDeviceUsbKm.sys
  #
  VERIFIER_FLAGS: '0x000BAFBF'

  WATCHDOG_TASK_NAME: 'WellspringVerifierWatchdog'
  WATCHDOG_REG_KEY: 'HKLM:\SOFTWARE\WellspringVerifierWatchdog'

jobs:
  enable-verifier:
    runs-on: [self-hosted, windows, x64, wellspring-hw]

    steps:
      - name: Validate confirmation
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          if ("${{ github.event.inputs.confirm }}" -ne "YES") {
            Write-Error "Confirmation not provided. Aborting."
            exit 1
          }

          Write-Host "Confirmation accepted."

      # ---------------------------------------------------------------
      # PRE-FLIGHT
      # ---------------------------------------------------------------

      - name: Preflight - verify runner is installed as a Windows service
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $svc = Get-Service |
            Where-Object { $_.Name -like "actions.runner*" }

          if (-not $svc) {
            Write-Error "GitHub Actions runner is not installed as a Windows service. It will NOT reconnect after reboot. Install via '.\config.cmd --runasservice' before proceeding."
            exit 1
          }

          if ($svc.Count -gt 1) {
            Write-Error "Multiple GitHub Actions runner services were found. Expected exactly one."
            $svc | Format-Table Name, Status, StartType
            exit 1
          }

          if ($svc.StartType -ne "Automatic") {
            Write-Error "Runner service StartType is '$($svc.StartType)', expected 'Automatic'. Fix with: Set-Service -Name $($svc.Name) -StartupType Automatic"
            exit 1
          }

          Write-Host "Runner service OK:"
          Write-Host "  Name      : $($svc.Name)"
          Write-Host "  Status    : $($svc.Status)"
          Write-Host "  StartType : $($svc.StartType)"

      - name: Preflight - verify Wellspring driver is present and loaded
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $drv = Get-CimInstance Win32_SystemDriver `
            -Filter "Name='AmtPtpDeviceUsbKm'"

          if (-not $drv) {
            Write-Error "Driver service AmtPtpDeviceUsbKm not found."
            exit 1
          }

          if ($drv.State -ne "Running") {
            Write-Error "Driver state is '$($drv.State)', expected 'Running'."
            exit 1
          }

          $fileName = Split-Path $drv.PathName -Leaf

          if ($fileName -ne $env:DRIVER_FILE) {
            Write-Error "Actual driver file '$fileName' does not match expected '$env:DRIVER_FILE'."
            exit 1
          }

          Write-Host "Driver OK:"
          Write-Host "  Service : AmtPtpDeviceUsbKm"
          Write-Host "  File    : $fileName"
          Write-Host "  State   : $($drv.State)"
          Write-Host "  Path    : $($drv.PathName)"

      - name: Preflight - verify disk space and pagefile for kernel dump
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $ramBytes = (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory
          $os = Get-CimInstance Win32_OperatingSystem
          $sysDrive = $os.SystemDrive
          $free = (Get-PSDrive -Name $sysDrive.TrimEnd(':')).Free

          $neededBytes = $ramBytes + 300MB

          Write-Host "RAM: $([math]::Round($ramBytes / 1GB, 2)) GB"
          Write-Host "Free on $sysDrive : $([math]::Round($free / 1GB, 2)) GB"
          Write-Host "Required free space: $([math]::Round($neededBytes / 1GB, 2)) GB"

          if ($free -lt $neededBytes) {
            Write-Error "Insufficient free disk space for the configured kernel memory dump."
            exit 1
          }

          $pf = Get-CimInstance Win32_PageFileUsage

          if (-not $pf) {
            Write-Warning "No pagefile detected or pagefile usage could not be queried. Verify manually that a sufficiently large pagefile exists for kernel dump collection."
          }
          else {
            $pf | Format-Table Name, AllocatedBaseSize, CurrentUsage, PeakUsage -AutoSize
          }

      # ---------------------------------------------------------------
      # CRASH DUMP
      # ---------------------------------------------------------------

      - name: Configure kernel memory dump collection
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $cc = "HKLM:\SYSTEM\CurrentControlSet\Control\CrashControl"

          # 2 = Kernel memory dump
          Set-ItemProperty `
            -Path $cc `
            -Name "CrashDumpEnabled" `
            -Value 2 `
            -Type DWord

          Set-ItemProperty `
            -Path $cc `
            -Name "DumpFile" `
            -Value "C:\Windows\MEMORY.DMP" `
            -Type ExpandString

          Set-ItemProperty `
            -Path $cc `
            -Name "AlwaysKeepMemoryDump" `
            -Value 1 `
            -Type DWord

          Set-ItemProperty `
            -Path $cc `
            -Name "AutoReboot" `
            -Value 0 `
            -Type DWord

          Set-ItemProperty `
            -Path $cc `
            -Name "Overwrite" `
            -Value 1 `
            -Type DWord

          Write-Host "Kernel memory dump configuration applied."

      # ---------------------------------------------------------------
      # WATCHDOG
      # ---------------------------------------------------------------

      - name: Arm watchdog
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $graceMinutes = [int]"${{ github.event.inputs.watchdog_grace_minutes }}"

          if ($graceMinutes -lt 1) {
            Write-Error "watchdog_grace_minutes must be at least 1."
            exit 1
          }

          New-Item `
            -Path $env:WATCHDOG_REG_KEY `
            -Force | Out-Null

          Set-ItemProperty `
            -Path $env:WATCHDOG_REG_KEY `
            -Name "Armed" `
            -Value 1 `
            -Type DWord

          Set-ItemProperty `
            -Path $env:WATCHDOG_REG_KEY `
            -Name "ArmedAtUtc" `
            -Value (Get-Date).ToUniversalTime().ToString("o") `
            -Type String

          Set-ItemProperty `
            -Path $env:WATCHDOG_REG_KEY `
            -Name "GraceMinutes" `
            -Value $graceMinutes `
            -Type DWord

          Set-ItemProperty `
            -Path $env:WATCHDOG_REG_KEY `
            -Name "BootCount" `
            -Value 0 `
            -Type DWord

          $watchdogScript = @'
          $ErrorActionPreference = "SilentlyContinue"

          $key = "HKLM:\SOFTWARE\WellspringVerifierWatchdog"
          $taskName = "WellspringVerifierWatchdog"

          if (-not (Test-Path $key)) {
              exit 0
          }

          $armedValue = Get-ItemProperty `
              -Path $key `
              -Name "Armed" `
              -ErrorAction SilentlyContinue

          if ($null -eq $armedValue -or $armedValue.Armed -ne 1) {
              exit 0
          }

          $bootValue = Get-ItemProperty `
              -Path $key `
              -Name "BootCount" `
              -ErrorAction SilentlyContinue

          $bootCount = 0

          if ($null -ne $bootValue -and $null -ne $bootValue.BootCount) {
              $bootCount = [int]$bootValue.BootCount
          }

          $bootCount++

          Set-ItemProperty `
              -Path $key `
              -Name "BootCount" `
              -Value $bootCount `
              -Type DWord

          $armedInfo = Get-ItemProperty `
              -Path $key `
              -Name "ArmedAtUtc", "GraceMinutes" `
              -ErrorAction SilentlyContinue

          if ($null -eq $armedInfo -or -not $armedInfo.ArmedAtUtc) {
              exit 0
          }

          $graceMin = 10

          if ($null -ne $armedInfo.GraceMinutes) {
              $graceMin = [int]$armedInfo.GraceMinutes
          }

          try {
              $armedAt = [datetime]::Parse(
                  $armedInfo.ArmedAtUtc
              ).ToUniversalTime()
          }
          catch {
              exit 0
          }

          $elapsed = (
              (Get-Date).ToUniversalTime() - $armedAt
          ).TotalMinutes

          # Let Windows finish booting before touching Verifier.
          Start-Sleep -Seconds 30

          # If the machine reached a second boot while Verifier is still
          # armed, or the grace period has expired, revert to a clean state.
          if ($bootCount -ge 2 -or $elapsed -gt $graceMin) {

              & verifier /reset

              Set-ItemProperty `
                  -Path $key `
                  -Name "Armed" `
                  -Value 0 `
                  -Type DWord

              Set-ItemProperty `
                  -Path $key `
                  -Name "RevertedAtUtc" `
                  -Value (Get-Date).ToUniversalTime().ToString("o") `
                  -Type String

              Unregister-ScheduledTask `
                  -TaskName $taskName `
                  -Confirm:$false `
                  -ErrorAction SilentlyContinue

              shutdown.exe `
                  /r `
                  /t 10 `
                  /c "Verifier watchdog: reverting to clean state after failed confirmation window"
          }
          '@

          $scriptPath = "C:\ProgramData\WellspringVerifierWatchdog.ps1"

          Set-Content `
            -Path $scriptPath `
            -Value $watchdogScript `
            -Encoding UTF8

          $action = New-ScheduledTaskAction `
            -Execute "powershell.exe" `
            -Argument "-NoProfile -ExecutionPolicy Bypass -File `"$scriptPath`""

          $trigger = New-ScheduledTaskTrigger -AtStartup

          $principal = New-ScheduledTaskPrincipal `
            -UserId "SYSTEM" `
            -LogonType ServiceAccount `
            -RunLevel Highest

          $settings = New-ScheduledTaskSettingsSet `
            -AllowStartIfOnBatteries `
            -DontStopIfGoingOnBatteries `
            -StartWhenAvailable

          Unregister-ScheduledTask `
            -TaskName $env:WATCHDOG_TASK_NAME `
            -Confirm:$false `
            -ErrorAction SilentlyContinue

          Register-ScheduledTask `
            -TaskName $env:WATCHDOG_TASK_NAME `
            -Action $action `
            -Trigger $trigger `
            -Principal $principal `
            -Settings $settings | Out-Null

          Write-Host "Watchdog armed."
          Write-Host "Grace window: $graceMinutes min."
          Write-Host "Task: $env:WATCHDOG_TASK_NAME"
          Write-Host "The post-reboot confirmation workflow must disarm the watchdog after a successful boot."

      # ---------------------------------------------------------------
      # DRIVER VERIFIER
      # ---------------------------------------------------------------

      - name: Apply Driver Verifier flags - Wellspring only
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Applying Driver Verifier configuration..."
          Write-Host "Driver : $env:DRIVER_FILE"
          Write-Host "Flags  : $env:VERIFIER_FLAGS"

          verifier /flags $env:VERIFIER_FLAGS /driver $env:DRIVER_FILE

          Write-Host ""
          Write-Host "=== verifier /querysettings ==="
          verifier /querysettings

          Write-Host ""
          Write-Host "=== verifier /query ==="
          verifier /query

      - name: Verify Driver Verifier configuration
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $settings = verifier /querysettings
          $settingsText = $settings -join "`r`n"

          Write-Host "=== Driver Verifier settings ==="
          Write-Host $settingsText

          # Verify Wellspring is explicitly present in the target list.
          $wellspringTargeted = $settingsText -match `
            '(?im)^\s*AmtPtpDeviceUsbKm\.sys\s*$'

          if (-not $wellspringTargeted) {
            Write-Error "AmtPtpDeviceUsbKm.sys is NOT present in the Driver Verifier target list."
            exit 1
          }

          # Verify NDIS/WIFI drivers are not explicitly targeted.
          $ndisTargeted = $settingsText -match `
            '(?im)^\s*ndis\.sys\s*$'

          $wdiTargeted = $settingsText -match `
            '(?im)^\s*wdiwifi\.sys\s*$'

          if ($ndisTargeted -or $wdiTargeted) {
            Write-Error "NDIS/WIFI driver detected in the Driver Verifier target list. This is not a Wellspring-only configuration."
            exit 1
          }

          # Verify the actual flag mask.
          $flagLine = ($settingsText -split "`r?`n") |
            Where-Object { $_ -match "Verifier Flags:" } |
            Select-Object -First 1

          if (-not $flagLine) {
            Write-Error "Could not find 'Verifier Flags:' in verifier /querysettings output."
            exit 1
          }

          if ($flagLine -notmatch "0x[0-9a-fA-F]+") {
            Write-Error "Could not parse Verifier flag mask."
            exit 1
          }

          $flagsText = $Matches[0]

          $flagsValue = [Convert]::ToUInt32(
            $flagsText.Substring(2),
            16
          )

          Write-Host ""
          Write-Host ("Parsed Verifier flags: 0x{0:X8}" -f $flagsValue)

          # Required:
          # Standard DDI Compliance
          if (($flagsValue -band 0x00020000) -eq 0) {
            Write-Error "Standard DDI Compliance (0x00020000) is NOT enabled."
            exit 1
          }

          # Required:
          # Additional DDI Compliance
          if (($flagsValue -band 0x00080000) -eq 0) {
            Write-Error "Additional DDI Compliance (0x00080000) is NOT enabled."
            exit 1
          }

          # Forbidden:
          # Systematic low resources simulation
          if (($flagsValue -band 0x00040000) -ne 0) {
            Write-Error "Systematic Low Resource Simulation (0x00040000) is enabled."
            exit 1
          }

          # Forbidden:
          # Reserved flag
          if (($flagsValue -band 0x00100000) -ne 0) {
            Write-Error "Reserved flag 0x00100000 is enabled."
            exit 1
          }

          # Forbidden:
          # NDIS/WIFI verification
          if (($flagsValue -band 0x00200000) -ne 0) {
            Write-Error "NDIS/WIFI Verification (0x00200000) is enabled."
            exit 1
          }

          Write-Host ""
          Write-Host "PASS: Driver Verifier is configured correctly."
          Write-Host "PASS: Target driver = $env:DRIVER_FILE"
          Write-Host "PASS: Standard DDI Compliance = ON"
          Write-Host "PASS: Additional DDI Compliance = ON"
          Write-Host "PASS: Systematic Low Resource Simulation = OFF"
          Write-Host "PASS: Reserved flag = OFF"
          Write-Host "PASS: NDIS/WIFI Verification = OFF"

      # ---------------------------------------------------------------
      # SNAPSHOT
      # ---------------------------------------------------------------

      - name: Snapshot pre-reboot state
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $runDir = "C:\VerifierRuns"

          New-Item `
            -ItemType Directory `
            -Path $runDir `
            -Force | Out-Null

          $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"

          $log = Join-Path `
            $runDir `
            "pre-reboot-$timestamp.txt"

          "=== DATE ===" |
            Out-File `
              -FilePath $log `
              -Encoding utf8

          (Get-Date).ToString("o") |
            Out-File `
              -FilePath $log `
              -Append `
              -Encoding utf8

          "`r`n=== VERIFIER QUERY SETTINGS ===" |
            Out-File `
              -FilePath $log `
              -Append `
              -Encoding utf8

          verifier /querysettings |
            Out-File `
              -FilePath $log `
              -Append `
              -Encoding utf8

          "`r`n=== VERIFIER QUERY ===" |
            Out-File `
              -FilePath $log `
              -Append `
              -Encoding utf8

          verifier /query |
            Out-File `
              -FilePath $log `
              -Append `
              -Encoding utf8

          "`r`n=== WELLSPRING SERVICE ===" |
            Out-File `
              -FilePath $log `
              -Append `
              -Encoding utf8

          Get-CimInstance Win32_SystemDriver `
            -Filter "Name='AmtPtpDeviceUsbKm'" |
            Format-List * |
            Out-String |
            Out-File `
              -FilePath $log `
              -Append `
              -Encoding utf8

          Write-Host "Pre-reboot snapshot written to:"
          Write-Host $log

      # ---------------------------------------------------------------
      # REBOOT
      # ---------------------------------------------------------------

      - name: Schedule delayed reboot
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          shutdown.exe `
            /r `
            /t 20 `
            /c "Rebooting to apply Driver Verifier flags (Wellspring only, watchdog armed)"

          Write-Host "Reboot scheduled in 20 seconds."
          Write-Host "The runner should reconnect automatically."
          Write-Host "Run DriverVerifierConfirmPostReboot after reconnect."
