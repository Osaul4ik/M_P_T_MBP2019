name: CodeQL

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PROJECT_DIR: src/AmtPtpDeviceUsbKm
  DRIVER_NAME: AmtPtpDeviceUsbKm
  CONFIGURATION: Release
  PLATFORM: x64
  # Версії зафіксовані під WindowsTargetPlatformVersion=10.0.26100.0
  # (Windows 11 24H2 SDK), яку білдить основний workflow. Це
  # задокументована Microsoft пара версій (гілка WHCP_24H2):
  # https://learn.microsoft.com/windows-hardware/drivers/devtest/static-tools-and-codeql
  CODEQL_CLI_VERSION: 2.15.4
  CODEQL_DRIVERS_PACK_VERSION: 1.1.0

jobs:
  codeql:
    runs-on: windows-2022

    # =========================================================================
    # SDV (Static Driver Verifier) офіційно deprecated і відсутній у WDK
    # новіших за build 26017 / у Windows 24H2 WDK - тобто в тому WDK, який
    # ставить основний build workflow. Microsoft прямо рекомендує CodeQL
    # як заміну для аналізу драйверів іде впред:
    # https://learn.microsoft.com/windows-hardware/drivers/devtest/using-sdv-and-the-sample-drivers
    #
    # Пак microsoft/windows-drivers несе спеціалізовані запити саме під
    # KMDF/WDM-патерни (IRQL, парність lock acquire/release, PnP/Power
    # callback-послідовності, deprecated pool API тощо) - той самий клас
    # проблем, який раніше ловив SDV.
    #
    # Окремий job без підпису драйвера - секрети не потрібні, працює й
    # на PR з форків.
    # =========================================================================
    permissions:
      contents: read
      security-events: write

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Install WDK
      run: |
        $wdkUrl = "https://go.microsoft.com/fwlink/?linkid=2085767"
        $wdkInstaller = "$env:TEMP\wdksetup.exe"
        Invoke-WebRequest -Uri $wdkUrl -OutFile $wdkInstaller
        Start-Process -FilePath $wdkInstaller -ArgumentList "/quiet /norestart" -Wait
      shell: pwsh

    # =====================================================================
    # Завантаження CodeQL CLI (не github/codeql-action - той не має
    # готового драйверного C++ query pack; беремо офіційний CLI-архів
    # напряму з github/codeql-cli-binaries).
    # =====================================================================
    - name: Download CodeQL CLI
      run: |
        $ErrorActionPreference = "Stop"
        $url = "https://github.com/github/codeql-cli-binaries/releases/download/v$env:CODEQL_CLI_VERSION/codeql-win64.zip"
        Write-Host "==> Downloading $url"
        Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\codeql.zip"
        Expand-Archive -Path "$env:TEMP\codeql.zip" -DestinationPath "$env:TEMP\codeql-home" -Force
        $codeqlExe = Get-ChildItem -Path "$env:TEMP\codeql-home" -Filter "codeql.exe" -Recurse | Select-Object -First 1
        if (-not $codeqlExe) {
          Write-Error "codeql.exe not found after extraction."
          exit 1
        }
        Add-Content -Path $env:GITHUB_ENV -Value "CODEQL_DIR=$($codeqlExe.DirectoryName)"
        Write-Host "OK: CodeQL CLI at $($codeqlExe.DirectoryName)"
      shell: pwsh

    - name: Verify CodeQL install
      run: |
        & "$env:CODEQL_DIR\codeql.exe" --version
      shell: pwsh

    - name: Download windows-drivers query pack
      run: |
        & "$env:CODEQL_DIR\codeql.exe" pack download "microsoft/windows-drivers@$env:CODEQL_DRIVERS_PACK_VERSION"
      shell: pwsh

    # =====================================================================
    # Створення CodeQL-бази: CodeQL сам перехоплює компіляцію під час
    # вказаної build-команди (msbuild rebuild цього vcxproj) і індексує
    # реальний скомпільований код, а не парсить файли окремо.
    # =====================================================================
    - name: Build CodeQL database
      run: |
        $ErrorActionPreference = "Stop"
        $dbPath = "$env:TEMP\codeql-db"
        $buildCmd = "msbuild /p:Configuration=$env:CONFIGURATION /p:Platform=$env:PLATFORM /p:WindowsTargetPlatformVersion=10.0.26100.0 $env:PROJECT_DIR\$env:DRIVER_NAME.vcxproj /t:rebuild"

        & "$env:CODEQL_DIR\codeql.exe" database create $dbPath `
          --language=cpp `
          --source-root=. `
          --command=$buildCmd

        Add-Content -Path $env:GITHUB_ENV -Value "CODEQL_DB=$dbPath"
      shell: pwsh

    # =====================================================================
    # recommended.qls - широкий набір перевірок під типові драйверні й
    # C/C++ баги (той самий пак містить mustrun.qls/mustfix.qls для
    # офіційної WHCP-сертифікації, якщо колись знадобиться).
    # =====================================================================
    - name: Analyze with CodeQL
      run: |
        & "$env:CODEQL_DIR\codeql.exe" database analyze "$env:CODEQL_DB" `
          "microsoft/windows-drivers:windows-driver-suites/recommended.qls" `
          --format=sarifv2.1.0 `
          --output="$env:TEMP\codeql-results.sarif"

        Add-Content -Path $env:GITHUB_ENV -Value "SARIF_PATH=$env:TEMP\codeql-results.sarif"
      shell: pwsh

    - name: Upload SARIF as build artifact
      uses: actions/upload-artifact@v4
      with:
        name: codeql-results
        path: ${{ env.SARIF_PATH }}

    # Публікує результати у вкладку Security > Code scanning репозиторію,
    # з анотаціями прямо в діафі PR.
    - name: Upload SARIF to GitHub code scanning
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ env.SARIF_PATH }}
