name: BuildGui (ConfigGui only)

on:
  push:
    branches: [ master, TestHID ]
  pull_request:
    branches: [ master, TestHID ]
  workflow_dispatch:

concurrency:
  group: build-gui-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # ---- GUI ----
  GUI_PROJECT_DIR: src/AmtPtpConfigGui
  GUI_PROJECT_NAME: AmtPtpConfigGui

jobs:

  # =============================================================================
  # GUI only: build + package. Driver, WDK, signing, and .cat generation are
  # not required here - the entire corresponding block from BuildAll.yml
  # has been removed.
  # Two final artifacts are uploaded:
  #   - WellspringPTP-Gui-Min-<version>   (framework-dependent, no .NET runtime)
  #   - WellspringPTP-Gui-Full-<version>  (self-contained)
  # =============================================================================
  build-and-package:
    name: Build GUI, package archives
    runs-on: windows-2022
    timeout-minutes: 60
    outputs:
      version: ${{ steps.setver.outputs.version }}

    steps:
    - uses: actions/checkout@v4

    # =====================================================================
    # Compute version/date - same format as BuildAll.yml for consistent
    # artifact naming.
    # =====================================================================
    - name: Compute build version and date
      id: setver
      run: |
        $ErrorActionPreference = "Stop"
        $now = Get-Date

        $buildDate    = $now.ToString("MM/dd/yyyy")
        $buildVersion = "1.$($now.Year).$($now.ToString('MMdd')).$($now.ToString('HHmm'))"

        Write-Host "==> Build date: $buildDate"
        Write-Host "==> Build version: $buildVersion"

        Add-Content -Path $env:GITHUB_ENV -Value "BUILD_DATE=$buildDate"
        Add-Content -Path $env:GITHUB_ENV -Value "BUILD_VERSION=$buildVersion"
        Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$buildVersion"
      shell: pwsh

    # =====================================================================
    # GUI: .NET SDK, restore, two publishes (framework-dependent and
    # self-contained).
    # =====================================================================
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore GUI project
      run: dotnet restore "$env:GUI_PROJECT_DIR\$env:GUI_PROJECT_NAME.csproj"
      shell: pwsh

    # Framework-dependent single file, win-x64: the exe is only a few MB,
    # but .NET 8 Desktop Runtime must be installed on the target machine.
    # This goes into the "Min" archive.
    - name: Publish GUI (framework-dependent, single file, win-x64)
      run: |
        dotnet publish "$env:GUI_PROJECT_DIR\$env:GUI_PROJECT_NAME.csproj" `
          -c Release `
          -r win-x64 `
          --self-contained false `
          -p:PublishSingleFile=true `
          -o artifacts/gui-min
      shell: pwsh

    # Self-contained single file, win-x64: larger exe (bundled CLR/WPF),
    # but no additional runtime installation is required. Goes into the
    # "Full" archive.
    - name: Publish GUI (self-contained, single file, win-x64)
      run: |
        dotnet publish "$env:GUI_PROJECT_DIR\$env:GUI_PROJECT_NAME.csproj" `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:EnableCompressionInSingleFile=true `
          -o artifacts/gui-full
      shell: pwsh

    # =====================================================================
    # Create the WellspringPTP/Gui structure for both variants - same
    # layout as in BuildAll.yml, only without the Driver directory.
    # =====================================================================
    - name: Stage folder structure (WellspringPTP/Gui)
      run: |
        $ErrorActionPreference = "Stop"

        New-Item -ItemType Directory -Path "stage/min/WellspringPTP/Gui"  -Force | Out-Null
        New-Item -ItemType Directory -Path "stage/full/WellspringPTP/Gui" -Force | Out-Null

        Copy-Item -Path "artifacts/gui-min/*"  -Destination "stage/min/WellspringPTP/Gui"  -Recurse -Force
        Copy-Item -Path "artifacts/gui-full/*" -Destination "stage/full/WellspringPTP/Gui" -Recurse -Force

        Write-Host "== stage/min =="
        Get-ChildItem -Recurse "stage/min" | Select-Object -ExpandProperty FullName
        Write-Host "== stage/full =="
        Get-ChildItem -Recurse "stage/full" | Select-Object -ExpandProperty FullName
      shell: pwsh

    - name: Upload Min archive (GUI without bundled .NET)
      uses: actions/upload-artifact@v4
      with:
        name: WellspringPTP-Gui-Min-${{ env.BUILD_VERSION }}
        path: stage/min
        if-no-files-found: error

    - name: Upload Full archive (GUI, self-contained)
      uses: actions/upload-artifact@v4
      with:
        name: WellspringPTP-Gui-Full-${{ env.BUILD_VERSION }}
        path: stage/full
        if-no-files-found: error

  # =============================================================================
  # Third artifact: installer (Inno Setup), built from the Min archive
  # (framework-dependent - smaller, does not bundle the self-contained runtime
  # into setup.exe). Separate job, depends on build-and-package and uses
  # download-artifact instead of the local staging directory to verify that
  # the Min archive is valid as a downloaded artifact.
  # =============================================================================
  package-installer:
    name: Build installer (Inno Setup, from Min)
    runs-on: windows-2022
    needs: build-and-package
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Download Min GUI artifact
      uses: actions/download-artifact@v4
      with:
        name: WellspringPTP-Gui-Min-${{ needs.build-and-package.outputs.version }}
        path: stage/min

    - name: Install Inno Setup
      run: choco install innosetup -y --no-progress
      shell: pwsh

    - name: Compile installer
      run: |
        $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        & $iscc `
          src\AmtPtpConfigGui\installer\WellspringControlCenter.iss `
          "/DMyAppVersion=${{ needs.build-and-package.outputs.version }}" `
          "/DSourceDir=$PWD\stage\min\WellspringPTP\Gui"
        if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
      shell: pwsh

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: WellspringPTP-Installer-${{ needs.build-and-package.outputs.version }}
        path: src/AmtPtpConfigGui/installer/output/*.exe
        if-no-files-found: error
